name: ci

# CI cadence, decided explicitly (Phase 3 of the Book 2 roadmap flagged this
# as a real decision, not a default): unit + orchestration tiers are free
# and deterministic, so they run on every push and PR. Integration,
# provider-contract, and evaluation tiers make real network calls (some
# against a paid model API), so they run only on version tags and on manual
# dispatch, not on every commit, to avoid burning live API cost per push.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit tests/orchestration -v

  live-tests:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # compose.yaml remaps Neo4j's host port to 7688 locally, only
      # because this book's own dev machine already has another
      # project's Neo4j on the standard port. CI has no such conflict,
      # the service container below uses Neo4j's real standard port.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: reliable-agents-labs
    # Chapters 12 and 18's real local services. Pinned to the same
    # digests compose.yaml uses, a GitHub Actions service container and
    # a local `docker compose up` are the same images either way.
    services:
      qdrant:
        image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
        ports:
          - 6333:6333
      neo4j:
        image: neo4j@sha256:22ec5cd05a8cbb372fc4bed5e384c30bc75fd92504c72be4462039761b105f61
        env:
          NEO4J_AUTH: neo4j/reliable-agents-labs
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest tests/contract tests/integration tests/evals -v
      # tests/integration is no longer empty as of chapter 10 (a real
      # call to PyPI's public API) and chapter 12 (a real local Qdrant,
      # the service container above). tests/evals is no longer empty as
      # of chapter 16 (a real golden dataset, scored as a pass rate, not
      # per-question pass/fail). All three run here, not in fast-tests,
      # for the same reason: real network calls and non-deterministic
      # model output do not belong in the free/constant job every push
      # and PR triggers.
