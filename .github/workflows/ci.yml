name: ci

# CI cadence, decided explicitly (Phase 3 of the Book 2 roadmap flagged this
# as a real decision, not a default): unit + orchestration tiers are free
# and deterministic, so they run on every push and PR. Integration,
# provider-contract, and evaluation tiers make real network calls (some
# against a paid model API), so they run only on version tags and on manual
# dispatch, not on every commit, to avoid burning live API cost per push.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit tests/orchestration -v

  live-tests:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest tests/contract tests/integration -v
      # tests/integration is no longer empty as of chapter 10 (a real
      # call to PyPI's public API), grouped with tests/contract here for
      # the same reason: a real external network call, not a scripted
      # fake, does not belong in the free/constant fast-tests job even
      # though it costs no money, PyPI being briefly unreachable should
      # not fail every PR. tests/evals joins once Project 2 has a golden
      # dataset, still placeholder-skipped until then.
