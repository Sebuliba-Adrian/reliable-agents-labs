[project]
name = "reliable-agents-labs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebuliba-Adrian", email = "adrian.sebuliba1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.2",
    "langgraph>=1.2.11",
    "neo4j>=6.3.0",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
reliable-agents-labs = "reliable_agents_labs:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
