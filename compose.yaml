# Real services get added chapter by chapter, each with an explicitly
# pinned image version decided at the point that chapter needs it (never
# `latest`, see book-playbook/working-agreements.md's reproducibility
# contract):
#
#   - Project 1, ch. 9 "Containerize It": the app service itself, below.
#   - Project 2, ch. 12 "A Real Vector Database": qdrant, below. Pinned by
#     digest, the real digest v1.19.1 resolved to when this was written:
#       docker pull qdrant/qdrant:v1.19.1
#       docker inspect qdrant/qdrant:v1.19.1 --format='{{index .RepoDigests 0}}'
#   - Project 3, ch. 18 "Graph Fundamentals": neo4j, below. Pinned to
#     the 5.26 LTS line deliberately, not the newer calendar-versioned
#     (YYYY.MM) release train Neo4j switched new releases to in
#     January 2025: LTS gets a three-year support window of critical
#     patches with no breaking changes, a better fit for a
#     production-minded book than a fast-moving monthly line. Real
#     digest resolved when this was written:
#       docker pull neo4j:5.26-community
#       docker inspect neo4j:5.26-community --format='{{index .RepoDigests 0}}'
#
# Langfuse is deliberately NOT a service in this file. It is self-hosted
# (chapter 9's decision), but as a separately maintained stack in
# langfuse/docker-compose.yml, Langfuse's own reference deployment, run
# on its own. Folding six services you do not maintain into your own
# project's compose file would make every Langfuse version bump this
# project's problem to track by hand; pointing at it over the network
# (LANGFUSE_HOST, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, in .env) keeps
# the boundary where it actually is.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env

  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j@sha256:22ec5cd05a8cbb372fc4bed5e384c30bc75fd92504c72be4462039761b105f61
    environment:
      NEO4J_AUTH: neo4j/reliable-agents-labs
    ports:
      # Host-side remapped, same reason chapter 9 remapped Langfuse's
      # port 3000: this machine already has another project's Neo4j
      # bound to the standard 7474/7687.
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j_data:/data

volumes:
  qdrant_data:
  neo4j_data:
